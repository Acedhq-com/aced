name: Validate ACED
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check syntax and internal links
        run: node tools/check.js
      - name: Build the public site
        run: node tools/build.js
      - name: Validate question banks
        run: |
          node tools/validate.js --pack cpa-far
          node tools/validate.js --pack cpa-bar
          node tools/validate.js --pack world-capitals
          node tools/validate.js --pack spanish-1k
      - name: Test pack import, persistence and sharing
        run: node aced-library.test.js
      - name: Test plain-text partial imports and issue reports
        run: node --test aced-parser.test.js
      - name: Test library bridge and safe importer navigation
        run: |
          node --test aced-bridge.test.js
          node aced-importer.test.js
          node tools/check.test.js
      - name: Test scoring engine and doctrines
        run: node tools/score.test.js
      - name: Test engine neutrality and pack-owned flavor
        run: |
          node engine-neutrality.test.js
          node cpa-shared.test.js
      - name: Test review identity and optional module contracts
        run: |
          node aced-core.test.js
          node aced-pack.test.js
          node aced-jokers.test.js
          node aced-vault.test.js
          node nemesis.test.js
          node nemesis-encounter.test.js
          node aced-pro.test.js
          node importer.extract.test.js
          node builder.contract.test.js
      - name: Test actual study runtime safety and correctness
        run: node --test aced-game-runtime.test.js
      - name: Validate and test task-based simulations
        run: |
          node tools/validate-tbs.js
          node aced-tbs.test.js
      - name: Test optional backend merge and leaderboard guards
        run: |
          node server/merge.test.js
          node server/leaderboard.test.js
      - name: Test sync and sign-in containment (core, account, guards, full server suite)
        run: |
          node aced-core.test.js
          node aced-account.test.js
          node server/sync-auth-guards.test.js
          cd server && npm test
      - name: Test auth, session, token storage, logging and database TLS hardening
        run: |
          node server/auth-flow.test.js
          node server/db-tls.test.js
          node aced-account-session.test.js
			- name: Cach
uses: actions/cache@v5.1.0
			with:
			# A list of files, directories, and wildcard patterns to cache and restore
			path: 
			# An explicit key for restoring and saving the cache
			key: 
			# An ordered multiline string listing the prefix-matched keys, that are used for restoring stale cache if no cache hit occurred for key. Note `cache-hit` returns false in this case.
			restore-keys: # optional
			# The chunk size used to split up large files during upload, in bytes
			upload-chunk-size: # optional
			# An optional boolean when enabled, allows windows runners to save or restore caches that can be restored or saved respectively on other platforms
			enableCrossOsArchive: # optional, default is false
			# Fail the workflow if cache entry is not found
			fail-on-cache-miss: # optional, default is false
			# Check if a cache entry exists for the given input(s) (key, restore-keys) without downloading the cache
			lookup-only: # optional, default is false
			# Run the post step to save the cache even if another step before fails
			save-always: # optional, default is false
